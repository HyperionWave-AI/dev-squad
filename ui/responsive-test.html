<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings Page Responsive Test</title>
    <link rel="stylesheet" href="../src/index.css">
    <style>
        /* Test-specific styles */
        .viewport-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #3b82f6;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            z-index: 1000;
        }
        
        .test-content {
            background: #f9fafb;
            min-height: 100vh;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="viewport-indicator" id="viewportIndicator">Mobile</div>
    
    <div class="test-content">
        <div class="settings-container">
            <nav class="settings-nav">
                <a href="#general" class="settings-nav-item active">General</a>
                <a href="#account" class="settings-nav-item">Account</a>
                <a href="#privacy" class="settings-nav-item">Privacy</a>
                <a href="#notifications" class="settings-nav-item">Notifications</a>
            </nav>
            
            <div class="settings-content">
                <header class="settings-header">
                    <h1>Settings</h1>
                    <p>Manage your account settings and preferences.</p>
                </header>
                
                <div class="settings-grid">
                    <section class="settings-section">
                        <h2>Profile Information</h2>
                        <div class="form-group">
                            <label class="form-label" for="name">Full Name</label>
                            <input type="text" id="name" class="form-input" placeholder="Enter your name">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" class="form-input" placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="bio">Bio</label>
                            <textarea id="bio" class="form-textarea" rows="3" placeholder="Tell us about yourself"></textarea>
                        </div>
                    </section>
                    
                    <section class="settings-section">
                        <h2>Preferences</h2>
                        <div class="form-group">
                            <label class="form-label" for="theme">Theme</label>
                            <select id="theme" class="form-select">
                                <option>Light</option>
                                <option>Dark</option>
                                <option>Auto</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="language">Language</label>
                            <select id="language" class="form-select">
                                <option>English</option>
                                <option>Spanish</option>
                                <option>French</option>
                            </select>
                        </div>
                    </section>
                    
                    <section class="settings-section">
                        <h2>Notifications</h2>
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox" checked> Email notifications
                            </label>
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox"> Push notifications
                            </label>
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                <input type="checkbox" checked> SMS notifications
                            </label>
                        </div>
                    </section>
                </div>
                
                <div style="margin-top: 2rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                    <button class="btn btn-primary">Save Changes</button>
                    <button class="btn btn-secondary">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Viewport indicator for testing
        function updateViewportIndicator() {
            const indicator = document.getElementById('viewportIndicator');
            const width = window.innerWidth;
            
            if (width < 640) {
                indicator.textContent = `Mobile (${width}px)`;
            } else if (width < 768) {
                indicator.textContent = `Tablet SM (${width}px)`;
            } else if (width < 1024) {
                indicator.textContent = `Tablet MD (${width}px)`;
            } else if (width < 1280) {
                indicator.textContent = `Desktop LG (${width}px)`;
            } else {
                indicator.textContent = `Desktop XL (${width}px)`;
            }
        }
        
        updateViewportIndicator();
        window.addEventListener('resize', updateViewportIndicator);
        
        // Test touch targets
        document.addEventListener('DOMContentLoaded', function() {
            const touchElements = document.querySelectorAll('.btn, .form-input, .form-select, .settings-nav-item');
            touchElements.forEach(el => {
                const rect = el.getBoundingClientRect();
                if (rect.height < 44) {
                    console.warn('Touch target too small:', el, `Height: ${rect.height}px`);
                }
            });
        });
    </script>
</body>
</html>
