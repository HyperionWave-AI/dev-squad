<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyper Desktop</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "SF Mono", "Menlo", "Monaco", monospace;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 30% 20%, #1d4ed8, #020617 55%);
        color: #e2e8f0;
      }

      .panel {
        width: min(640px, 90vw);
        padding: 2rem;
        border-radius: 1rem;
        background: rgba(2, 6, 23, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.4);
        box-shadow: 0 20px 40px rgba(2, 6, 23, 0.4);
      }

      .title {
        margin: 0 0 0.75rem;
        font-size: 1.2rem;
        letter-spacing: 0.04em;
      }

      .text {
        margin: 0;
        line-height: 1.6;
        font-size: 0.95rem;
        color: #cbd5e1;
      }

      .pulse {
        display: inline-block;
        margin-right: 0.5rem;
        width: 0.6rem;
        height: 0.6rem;
        border-radius: 999px;
        background: #22d3ee;
        box-shadow: 0 0 20px rgba(34, 211, 238, 0.8);
        animation: pulse 1.2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(0.85);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <h1 class="title"><span class="pulse"></span>Starting Hyper backend…</h1>
      <p class="text">
        The desktop shell is launching the local Hyper service and will open the full UI as soon as it is ready.
      </p>
    </main>
  </body>
</html>
